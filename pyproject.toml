[build-system]
requires = ["setuptools>=77", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-qa-agent"
version = "1.0.0"
description = "Multi-tenant brand Q&A API built with FastAPI, LangGraph, and retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brand Q&A Agent" }]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "lxml>=5.2.0,<6.0.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-text-splitters>=0.3.0,<0.4.0",
    "langgraph>=0.2.0,<0.3.0",
    "pinecone>=5.0.0,<6.0.0",
]

[project.optional-dependencies]
providers = [
    "langchain-openai>=0.2.0,<0.3.0",
    "langchain-anthropic>=0.2.0,<0.3.0",
    "langchain-google-genai>=2.0.0,<3.0.0",
    "chromadb>=0.5.0,<1.0.0",
]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "respx>=0.21.0,<1.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/syed-sadain/Brand-Q-A-Agent-"
Documentation = "https://github.com/syed-sadain/Brand-Q-A-Agent-#readme"

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
    "ignore::PendingDeprecationWarning",
    "ignore::DeprecationWarning",
]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".data", ".chroma", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI uses function calls (Depends/Path/Field) in argument defaults
    "RUF001",  # allow typographic punctuation in strings/docstrings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# conftest mutates sys.path before importing the application package on purpose.
"tests/conftest.py" = ["E402"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = ["^tests/", "^\\.venv/"]
