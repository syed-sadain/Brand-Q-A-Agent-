# Docker Compose for the Brand Q&A Agent.
#
# One-command startup:
#     docker compose up --build
#
# Values are read from your shell environment and (automatically) from a local
# `.env` file placed next to this compose file. Every variable has a safe
# default so the stack also starts without any configuration.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: brand-qa-agent:latest
    container_name: brand-qa-agent
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-Brand Q&A Agent}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      API_VERSION: ${API_VERSION:-v1}

      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}

      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}

      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-pinecone}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-brand-qa-agent}
      PINECONE_CLOUD: ${PINECONE_CLOUD:-aws}
      PINECONE_REGION: ${PINECONE_REGION:-us-east-1}

      CHUNK_SIZE: ${CHUNK_SIZE:-400}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-50}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}

      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      DOCUMENT_REGISTRY_PATH: /app/.data/document_registry.json
    volumes:
      # Persist the document registry across container restarts.
      - brand-qa-data:/app/.data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  brand-qa-data:
